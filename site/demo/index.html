<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handful — the box</title>
<meta name="description" content="Interactive demonstration of the Handful recipe-shortlisting model on real Food.com profiles: choose a person, move the rules, watch the six re-solve.">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a211b'/%3E%3Cg fill='%23fbf5ea'%3E%3Crect x='7' y='16' width='4' height='9' rx='1.2'/%3E%3Crect x='13' y='11' width='4' height='14' rx='1.2'/%3E%3Crect x='19' y='7' width='4' height='18' rx='1.2'/%3E%3C/g%3E%3C/svg%3E">
</head>

<body>
<!-- DIRECTION CONTRACT · seed e824c2b · 0xe824c2b mod 7 = 5 · form: the recipe card index (6 of 7) · D-029 · composition D-032: the board is the screen, the other views open over it -->
<div class="ground" aria-hidden="true"><picture><source media="(max-width:760px)" srcset="/img/gen/ground-box-tall-w1080.webp"><img src="/img/gen/ground-box-wide-w1600.webp" alt="" decoding="async"></picture></div>
<header class="site-head static">
  <div class="wrap">
    <a class="mark" href="/" aria-label="Handful, the story">
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2a211b"/><g fill="#fbf5ea"><rect x="7" y="16" width="4" height="9" rx="1.2"/><rect x="13" y="11" width="4" height="14" rx="1.2"/><rect x="19" y="7" width="4" height="18" rx="1.2"/></g></svg>
      <span>Handful</span>
    </a>
    <nav class="site-nav" aria-label="Views">
      <button type="button" data-sheet="compare">Four ways</button>
      <button type="button" data-sheet="solved">How it's solved</button>
      <a href="/try/">Try it</a>
      <a href="/">← The story</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap box-head">
    <img class="prop prop-box" src="/img/gen/prop-box-open-w900.webp" alt="" width="900" height="900" loading="lazy" decoding="async">
    <h1>The box</h1>
    <p class="countline" id="boxcount"></p>
    <div id="banners"></div>
  </div>

  <div class="wrap box-main">
    <div class="controls-line" aria-label="Controls">
      <div class="field">
        <label for="profile">Whose box</label>
        <select id="profile" data-profile></select>
      </div>
      <div class="field slider">
        <label for="k"><span>Cards to pull</span><span class="val" id="k-val">6</span></label>
        <input type="range" id="k" min="2" max="12" value="6" step="1">
      </div>
      <div class="field slider">
        <label for="cap"><span>Max behind one divider</span><span class="val" id="cap-val">3</span></label>
        <input type="range" id="cap" min="1" max="12" value="3" step="1">
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <div style="display:flex;gap:1rem;align-items:center"><button class="link-btn" id="reset" type="button">study settings</button><button class="link-btn" type="button" data-sheet="profile">their cards</button></div>
      </div>
    </div>
    <div id="view" aria-live="polite"><p class="hint">Loading…</p></div>
    <details class="working">
      <summary>Method detail</summary>
      <div class="working-body" id="view-working"></div>
    </details>
  </div>

  <div class="wrap colophon" style="padding-bottom:3rem">
    <p class="hint" id="foot-note" style="max-width:none"></p>
    <div id="credits" class="credits"></div>
    <p class="hint" style="margin-top:1rem"><a href="/">Back to the story</a> · Not affiliated with Food.com. No data is collected by this page.</p>
  </div>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-panel">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="sheet-close" type="button" id="sheet-close">Back to the board</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<script src="/assets/viz.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
