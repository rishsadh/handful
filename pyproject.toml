[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handful"
version = "2.0.0"
description = "Handful - personalised recipe shortlisting using linear programming, an offline study of Food.com ratings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core stack. Deliberately excludes torch/sentence-transformers: they are a ~2.5 GB
# install and are only needed for real AI scoring runs, not for the test suite.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ai = [
    "torch>=2.2",
    "sentence-transformers>=2.7",
]
app = [
    "streamlit>=1.33",
    "plotly>=5.20",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises the full synthetic pipeline",
    "needs_ai: requires torch + sentence-transformers",
    "needs_real_data: requires data/raw/RAW_*.csv to be present",
]
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001/RUF003: the LP formulation, captions and dual notation are written with real
# mathematical characters (alpha, beta, gamma, the minus sign, en dashes). They are
# deliberate, and transliterating them would make the model harder to read.
ignore = ["E501", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
