# Fixed tag whitelist for the rendered recipe text.
#
# This is a WHITELIST: `unknown_tag_policy: exclude` means any tag not matched by an
# allow rule is dropped. Deny rules are applied first and win over allow rules, so a
# tag can never sneak in through a pattern.
#
# Why tags are filtered at all: Food.com tags mix descriptive content ("italian",
# "main-dish") with administrative and duration metadata ("time-to-make",
# "60-minutes-or-less", "number-of-servings"). Duration tags encode the preparation-time
# band directly, which is the axis the LP constrains - feeding them to the encoder would
# confound the relevance score with the constraint dimension.
#
# Completing this file: run `python tasks.py audit`. It exports
# `reports/audit/tag_vocabulary.csv` with every tag and its frequency. Add genuinely
# descriptive tags to `allow_exact` from that evidence. Do not guess tag names.

unknown_tag_policy: exclude
max_tags_per_recipe: 12
tag_order: "as_listed_in_source"   # deterministic; no frequency-based reordering

# Applied first. A tag matching any of these is excluded even if it also matches allow.
deny_regex:
  - '^time-to-make$'
  - 'minutes-or-less$'          # 15-minutes-or-less, 30-minutes-or-less, 60-minutes-or-less
  - 'hours-or-less$'            # 4-hours-or-less
  - '^weeknight$'               # duration proxy
  - '^number-of-servings$'
  - '^servings-'
  - '^\d+-servings$'
  - '^ratings?$'
  - '^rating-'
  - 'popular'
  - 'review'
  - '^submitted'
  - '^date'
  - '^year'
  - '^\d{4}$'                   # bare years
  - '^contributor'
  - '^user'
  - '^id$'
  - '^food-com'
  - '^rzepa'                    # site-admin housekeeping tags
  - '^presentation$'
  - '^technique$'
  - '^equipment$'               # bare container tags carry no content
  - '^occasion$'
  - '^course$'
  - '^cuisine$'
  - '^main-ingredient$'
  - '^preparation$'
  - '^dietary$'
  - '^taste-mood$'
  # Added 2026-09-06 from the real tag vocabulary. All four are proxies for the axis
  # the LP constrains: an explicit duration the earlier regexes missed, and effort
  # statements that strongly predict preparation time.
  - 'days?-or-more$'
  - 'steps-or-less$'
  - 'ingredients-or-less$'
  - '^free-of-something$'

